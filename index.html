<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zooov Store — Catalogue</title>
<meta name="description" content="Zooov — Echoes of Life. Wedding return gifts, potlis, steel boxes, platters, bags and more. Order on WhatsApp.">
<meta property="og:title" content="Zooov Store — Catalogue">
<meta property="og:description" content="637+ wedding return gift designs. Browse and order on WhatsApp.">
<meta property="og:image" content="assets/logo.png">
<meta name="theme-color" content="#262262">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#262262;--navy2:#3a3590;--orange:#ff3700;--yellow:#ffd700;--ink:#1c1b2e;--muted:#74738a;--line:#ececf3;--bg:#f4f4f8;--wa:#1faa53;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
img{display:block}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff}
.tb{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px}
.lg{display:flex;align-items:center;gap:8px;flex:none}
.lg img{width:36px;height:36px;border-radius:50%}
.lg b{font-size:1.15rem;font-weight:700;letter-spacing:.3px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;height:40px;border-radius:10px;border:0;padding:0 12px 0 38px;font:inherit;font-size:.9rem;outline:none}
.sbox svg{position:absolute;left:11px;top:9px;color:var(--muted)}
.tic{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px}
.tic:hover{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:2px;right:0;background:var(--yellow);color:var(--navy);font-size:.65rem;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
.desk{display:none}

/* category strip */
.cstrip{background:#fff;border-bottom:1px solid var(--line)}
.cs{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:12px 10px 10px;scrollbar-width:none}
.cs::-webkit-scrollbar{display:none}
.ci{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.7rem;line-height:1.2;color:var(--ink);font-weight:500}
.ci .cc{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#f1f0f8;display:flex;align-items:center;justify-content:center;color:var(--navy);border:2px solid transparent}
.ci .cc img{width:100%;height:100%;object-fit:cover}
.ci.on .cc{border-color:var(--orange)}
.ci.soon{color:var(--muted)}
.ci.soon .cc{color:#9b99bd}

main{max-width:1200px;margin:0 auto;padding:12px 12px 96px}

/* banner */
.banner{border-radius:18px;background:var(--navy);color:#fff;display:flex;overflow:hidden;min-height:170px;position:relative}
.banner .bt{padding:22px 20px;flex:1;z-index:1;display:flex;flex-direction:column;justify-content:center}
.banner small{color:var(--yellow);font-weight:600;letter-spacing:1.2px;font-size:.68rem}
.banner h1{font-size:1.45rem;line-height:1.2;margin:6px 0 4px;font-weight:700}
.banner p{font-size:.8rem;opacity:.85}
.banner .cta{margin-top:14px;background:var(--yellow);color:var(--navy);font-weight:700;font-size:.82rem;padding:9px 16px;border-radius:9px;width:fit-content}
.banner .bi{width:44%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.banner .bi img{width:100%;height:100%;object-fit:cover}
.banner .bi img:first-child{grid-row:span 2}

.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:1.05rem;font-weight:600}
.sec a{font-size:.8rem;color:var(--navy2);font-weight:600}

/* collections */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.col img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.col div{padding:7px 8px 9px}
.col b{display:block;font-size:.76rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col span{font-size:.7rem;color:var(--orange);font-weight:600}

/* toolbar */
.head{background:#fff;border-radius:var(--r);padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line)}
.crumb{font-size:.72rem;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--navy2);font-weight:500}
.head h1{font-size:1.15rem;font-weight:600}
.head p{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:60px;z-index:20;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:.76rem;font-weight:500;white-space:nowrap}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.txt{padding:7px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;font-size:.78rem;color:var(--muted)}
.bar select{font:inherit;font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;color:var(--ink)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);position:relative}
.card .im{aspect-ratio:1;flex:none;overflow:hidden;background:#f2f2f6;cursor:pointer}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--navy);font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.4px}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;flex:1}
.card .nm{font-size:.8rem;font-weight:500;line-height:1.3;color:#3a3950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{margin-top:3px;font-size:1.08rem;font-weight:700}
.card .pr small{font-size:.7rem;font-weight:500;color:var(--muted)}
.card .mq{font-size:.68rem;color:#17803d;background:#e9f7ee;border-radius:5px;padding:1px 6px;width:fit-content;margin-top:3px;font-weight:500}
.card .ad{margin-top:9px;border:1.5px solid var(--navy);color:var(--navy);border-radius:9px;padding:6px;font-size:.78rem;font-weight:600;text-align:center}
.card .ad.on{background:var(--navy);color:#fff}

.empty{background:#fff;border-radius:var(--r);padding:50px 20px;text-align:center;color:var(--muted);border:1px solid var(--line)}
.empty .ei{width:64px;height:64px;border-radius:50%;background:#f1f0f8;color:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .ei svg{width:30px;height:30px}
.empty h3{color:var(--ink);font-size:1rem;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border-radius:10px;padding:12px 18px;font-size:.88rem}
.btn.wa{background:var(--wa);color:#fff}
.btn.nv{background:var(--navy);color:#fff}
.btn.ln{border:1.5px solid var(--navy);color:var(--navy)}

/* bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.66rem;color:var(--muted);position:relative}
.bnav .on{color:var(--navy);font-weight:600}
.bnav .badge{top:3px;right:calc(50% - 20px)}

/* modal / sheet */
.ov{position:fixed;inset:0;background:rgba(15,13,40,.5);z-index:50;display:none}
.md{position:fixed;z-index:51;background:#fff;display:none;flex-direction:column;left:0;right:0;bottom:0;max-height:92vh;border-radius:20px 20px 0 0;overflow:hidden}
.md .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.pv{overflow:auto}
.pv .pim{position:relative;background:#f2f2f6}
.pv .pim img{width:100%;max-height:52vh;object-fit:contain;margin:0 auto}
.pv .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.pv .pl{left:10px}.pv .pr2{right:10px}
.pv .pb{padding:14px 16px 18px}
.pv .cd{font-size:.72rem;color:var(--muted);font-weight:500}
.pv h3{font-size:1.05rem;font-weight:600;margin:2px 0}
.pv .pp{font-size:1.4rem;font-weight:700}
.pv .pp small{font-size:.8rem;color:var(--muted);font-weight:500}
.pv .ds{font-size:.82rem;color:#4b4a60;margin-top:6px}
.pv .mq{display:inline-block;font-size:.75rem;color:#17803d;background:#e9f7ee;border-radius:6px;padding:3px 8px;margin-top:8px;font-weight:500}
.qty{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:.82rem}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:38px;height:38px;font-size:1.1rem;color:var(--navy);font-weight:600}
.step input{width:64px;height:38px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-weight:600}
.pacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sh .hd{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sh .hd h3{font-size:1.05rem}
.sh .hd p{font-size:.75rem;color:var(--muted)}
.sh .ls{overflow:auto;padding:4px 14px;flex:1}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.it .t{flex:1;min-width:0}
.it .t b{font-size:.8rem;display:block}
.it .t span{font-size:.72rem;color:var(--muted)}
.it input{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-size:.82rem}
.it .rm{color:var(--muted);padding:6px}
.sh .ft{padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.sh .ft input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.8rem;padding:9px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}

footer{text-align:center;color:var(--muted);font-size:.72rem;padding:20px 12px 90px}

@media(min-width:760px){
  .desk{display:flex}
  .bnav{display:none}
  main{padding:18px 18px 40px}
  footer{padding-bottom:30px}
  .cs{justify-content:flex-start;gap:10px;padding:14px 18px 12px}
  .ci{width:88px;font-size:.74rem}.ci .cc{width:68px;height:68px}
  .banner{min-height:240px;max-height:300px}.banner .bt{padding:36px 40px}.banner h1{font-size:2.1rem}.banner p{font-size:.92rem}
  .cols{grid-template-columns:repeat(6,1fr);gap:14px}
  .grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .chips{top:60px}
  .md{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:88vh;border-radius:20px}
  .md.pvm .pv{display:grid;grid-template-columns:1.1fr 1fr}
  .pv .pim{display:flex;align-items:center}.pv .pim img{max-height:80vh}
  .md.shm{width:min(520px,94vw);height:min(640px,88vh)}
  .toast{bottom:30px}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<div class="top">
  <div class="tb">
    <a class="lg" href="#/"><img src="assets/logo.png" alt="Zooov"><b>Zooov</b></a>
    <div class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search potli, steel box, code…"></div>
    <a class="tic desk" id="twa" target="_blank" rel="noopener" title="WhatsApp us"><svg class="i" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c.3 1.8 2.1 3.9 4.2 4.6l1.2-1.1 1.8.8-.4 1.6c-3.6.3-7.5-3.4-7.3-7.2l1.6-.4.8 1.8z"/></svg></a>
    <button class="tic desk" data-open="list" title="Enquiry list"><svg class="i" viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span class="badge"></span></button>
  </div>
</div>
<div class="cstrip"><div class="cs" id="cs"></div></div>

<main id="app"></main>
<footer>© Zooov Store · Echoes of Life · Bulk & wedding orders welcome · Shipping extra</footer>

<nav class="bnav">
  <a href="#/" data-nav="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#/all" data-nav="all"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Categories</a>
  <a id="bwa" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c.3 1.8 2.1 3.9 4.2 4.6l1.2-1.1 1.8.8-.4 1.6c-3.6.3-7.5-3.4-7.3-7.2l1.6-.4.8 1.8z"/></svg>WhatsApp</a>
  <button data-open="list"><svg class="i" viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Enquiry<span class="badge"></span></button>
</nav>

<div class="ov" id="ov"></div>
<div class="md pvm" id="pm"><button class="x" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="pv" id="pv"></div></div>
<div class="md sh shm" id="sm"><button class="x" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="hd"><h3>Enquiry list</h3><p>Add designs & quantities, then send to us on WhatsApp for a quote.</p></div>
  <div class="ls" id="ls"></div>
  <div class="ft"><input id="nm" placeholder="Your name (optional)"><a class="btn wa" id="send" target="_blank" rel="noopener">Send enquiry on WhatsApp</a><button class="btn ln" id="clr">Clear list</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wa=t=>`https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent(t)}`;
const ICON={
"wedding-return-gifts":'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9c-1.5-3-5-4-5-1.5S10 9 12 9zm0 0c1.5-3 5-4 5-1.5S14 9 12 9z"/>',
"christmas-special":'<path d="M12 2l5 7h-3l4 6h-4l3 4H7l3-4H6l4-6H7z"/><path d="M12 19v3"/>',
"lamps":'<path d="M8 3h8l3 8H5z"/><path d="M12 11v8M8 21h8"/>',
"steel-bottles-mugs-tumblers":'<path d="M9 2h6v3l1 2v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7l1-2z"/><path d="M8 11h8"/>',
"plushy-keychains":'<circle cx="12" cy="14" r="6"/><circle cx="7" cy="8" r="2.2"/><circle cx="17" cy="8" r="2.2"/><path d="M10 14h.01M14 14h.01M10.5 17h3"/>',
"stationery":'<path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/>',
"action-figures":'<circle cx="12" cy="5" r="2.5"/><path d="M7 10h10l-2 4v7h-2v-5h-2v5H9v-7z"/>',
"keychains":'<circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M16 16l2-2M18 18l2-2"/>',
"squishy":'<path d="M4 15c0-5 3.5-9 8-9s8 4 8 9c0 3-3 5-8 5s-8-2-8-5z"/><path d="M9 13h.01M15 13h.01M10.5 16c1 .7 2 .7 3 0"/>',
"glass-bottles-mugs-tumblers":'<path d="M6 3h12l-1.5 17a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1z"/><path d="M6.5 9h11"/>',
"towels":'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 7a3 3 0 0 1 3-3M8 20V9"/>',
"crockery-mugs":'<path d="M4 8h12v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',
"household":'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
"organizers":'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/>',
"plastic-bottles-mugs-tumblers":'<path d="M10 2h4v2l2 3v13a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V7l2-3z"/><path d="M8 12c2 1 6 1 8 0"/>',
"bags":'<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'};
const ico=(s,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24">${ICON[s]||ICON.bags}</svg>`;
const pad=n=>String(n).padStart(2,"0");
const img=(s,i)=>`img/${s.slug}/${pad(i+1)}.jpg`;
function parse(it){
  const m=it.p.match(/Rs\.?\s*([\d,]+)\/-\s*(.*)/i)||[];const val=parseInt((m[1]||"0").replace(/,/g,""));
  let unit=(m[2]||"").replace(/^each\b/i,"pc").replace(/^per\s+/i,"").trim()||"pc";
  if(/pair/i.test(unit))unit="pair";
  const parts=it.d.split("|").map(x=>x.trim()).filter(Boolean);
  let moq=parts.find(x=>/MOQ|Packet\s*=/.test(x))||"";const det=parts.filter(x=>x!==moq).join(" · ");
  moq=moq.replace(/MOQ:\s*/i,"Min. ");
  return{val,unit,moq,det};
}
const ALL=[];CATEGORIES.forEach(c=>c.subs.forEach(s=>{s.cat=c;s.items.forEach((it,i)=>{Object.assign(it,parse(it));it.s=s;it.i=i;ALL.push(it)})}));
const BY={};ALL.forEach(it=>BY[it.c]=it);
const priceHTML=it=>`₹${it.val.toLocaleString("en-IN")} <small>/ ${esc(it.unit)}</small>`;
$("#twa").href=$("#bwa").href=wa("Hi Zooov! I'd like to know more about your products.");

/* ---------- enquiry list ---------- */
let L=[];try{L=JSON.parse(localStorage.getItem("zooov_enq")||"[]").filter(x=>BY[x.c])}catch(e){}
const save=()=>{try{localStorage.setItem("zooov_enq",JSON.stringify(L))}catch(e){}badge()};
const badge=()=>$$(".badge").forEach(b=>{b.textContent=L.length;b.style.display=L.length?"flex":"none"});
const inL=c=>L.find(x=>x.c===c);
function addL(c,q){const e=inL(c);if(e){e.q=q||e.q}else L.push({c,q:q||""});save();toast(`${c} added to enquiry list`);refreshBtns()}
function rmL(c){L=L.filter(x=>x.c!==c);save();refreshBtns()}
function refreshBtns(){$$("[data-add]").forEach(b=>{const on=!!inL(b.dataset.add);b.classList.toggle("on",on);b.textContent=on?"✓ Added":"Add to enquiry"})}
function renderList(){
  $("#ls").innerHTML=L.length?L.map(x=>{const it=BY[x.c];return `<div class="it"><img src="${img(it.s,it.i)}" alt=""><div class="t"><b>${esc(it.s.t)}</b><span>${esc(it.c)} · ₹${it.val} / ${esc(it.unit)}</span></div><input type="number" min="1" placeholder="Qty" value="${esc(x.q)}" data-q="${x.c}"><button class="rm" data-rm="${x.c}">${'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'}</button></div>`}).join(""):`<div class="empty" style="border:0"><div class="ei">${ico("organizers")}</div><h3>Your list is empty</h3><p>Tap “Add to enquiry” on any design.</p></div>`;
  const nm=$("#nm").value.trim();
  const lines=L.map((x,i)=>{const it=BY[x.c];return `${i+1}. ${it.c} – ${it.s.t} (₹${it.val}/${it.unit})${x.q?` × ${x.q}`:""}`}).join("\n");
  $("#send").href=wa(`Hi Zooov!${nm?` I'm ${nm}.`:""} Please share a quote for:\n\n${lines}\n\nThank you!`);
}
$("#ls").addEventListener("input",e=>{const c=e.target.dataset.q;if(c){inL(c).q=e.target.value;save();renderList()}});
$("#ls").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){rmL(b.dataset.rm);renderList()}});
$("#nm").addEventListener("input",renderList);
$("#clr").onclick=()=>{L=[];save();renderList();refreshBtns()};

/* ---------- modals ---------- */
function open(id){$("#ov").style.display="block";$(id).style.display="flex";document.body.style.overflow="hidden"}
function closeAll(){$("#ov").style.display="none";$$(".md").forEach(m=>m.style.display="none");document.body.style.overflow=""}
$("#ov").onclick=closeAll;$$("[data-close]").forEach(b=>b.onclick=closeAll);
$$("[data-open=list]").forEach(b=>b.onclick=()=>{renderList();open("#sm")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();if($("#pm").style.display==="flex"){if(e.key==="ArrowLeft")$(".pl")?.click();if(e.key==="ArrowRight")$(".pr2")?.click()}});
function showP(c){
  const it=BY[c],s=it.s,n=s.items.length,prev=s.items[(it.i-1+n)%n].c,next=s.items[(it.i+1)%n].c;
  const q=inL(c)?.q||"";
  $("#pv").innerHTML=`<div class="pim"><img src="${img(s,it.i)}" alt="${esc(s.t)}"><button class="nav pl" data-p="${prev}"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="nav pr2" data-p="${next}"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="pb"><div class="cd">Design ${esc(it.c)} · ${it.i+1} of ${n}</div><h3>${esc(s.t)}</h3><div class="pp">${priceHTML(it)}</div>
  ${it.det?`<div class="ds">${esc(it.det)}</div>`:""}${it.moq?`<span class="mq">${esc(it.moq)}</span>`:""}
  <div class="qty">Quantity <div class="step"><button data-st="-1">−</button><input id="pq" type="number" min="1" value="${esc(q)}" placeholder="Qty"><button data-st="1">+</button></div></div>
  <div class="pacts"><button class="btn ln" id="padd">${inL(c)?"Update list":"Add to enquiry"}</button><a class="btn wa" id="pwa" target="_blank" rel="noopener">Order on WhatsApp</a></div></div>`;
  const upd=()=>{const v=$("#pq").value;$("#pwa").href=wa(`Hi Zooov! I'd like to order design ${it.c} – ${s.t} (₹${it.val}/${it.unit})${v?`, quantity: ${v}`:""}. Please share details.`)};upd();
  $("#pq").oninput=upd;
  $$("[data-st]").forEach(b=>b.onclick=()=>{const base=parseInt((it.moq.match(/\d+/)||[1])[0])||1;let v=parseInt($("#pq").value)||0;v=v?Math.max(1,v+(+b.dataset.st)*(base>=10?5:1)):base;$("#pq").value=v;upd()});
  $("#padd").onclick=()=>{addL(c,$("#pq").value);$("#padd").textContent="Update list"};
  $$("[data-p]").forEach(b=>b.onclick=()=>showP(b.dataset.p));
  if($("#pm").style.display!=="flex")open("#pm");
}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1600)}

/* ---------- views ---------- */
const app=$("#app");
function card(it){const on=!!inL(it.c);return `<div class="card"><div class="im" data-show="${it.c}"><img loading="lazy" src="${img(it.s,it.i)}" alt="${esc(it.s.t)}"></div><span class="tag">${esc(it.c)}</span>
<div class="bd"><div class="nm">${esc(it.s.t)}</div><div class="pr">${priceHTML(it)}</div>${it.moq?`<div class="mq">${esc(it.moq)}</div>`:""}<button class="ad ${on?"on":""}" data-add="${it.c}">${on?"✓ Added":"Add to enquiry"}</button></div></div>`}
function strip(active){
  $("#cs").innerHTML=CATEGORIES.map(c=>{const live=c.subs.length;
    return `<a class="ci ${live?"":"soon"} ${active===c.slug?"on":""}" href="#/c/${c.slug}"><span class="cc">${live?`<img src="${img(c.subs[0],0)}" alt="">`:ico(c.slug)}</span>${esc(c.name)}</a>`}).join("");
}
function grid(items,sortKey){
  const arr=[...items];if(sortKey==="lo")arr.sort((a,b)=>a.val-b.val);if(sortKey==="hi")arr.sort((a,b)=>b.val-a.val);
  return `<div class="grid">${arr.map(card).join("")}</div>`;
}
let sortKey="rec";
function toolbar(n){return `<div class="bar"><span>${n} designs</span><select id="sort"><option value="rec">Sort: Recommended</option><option value="lo">Price: Low to High</option><option value="hi">Price: High to Low</option></select></div>`}
function bindSort(fn){const s=$("#sort");if(s){s.value=sortKey;s.onchange=()=>{sortKey=s.value;fn()}}}
function home(){
  strip("");const w=CATEGORIES.find(c=>c.subs.length);const subs=w?w.subs:[];
  const pick=["sb","p5","cb","st","r6","bc"].map(k=>subs.find(s=>s.slug===k)).filter(Boolean);
  const feat=[];pick.forEach(s=>s.items.slice(0,2).forEach(it=>feat.push(it)));
  const lo=Math.min(...ALL.map(x=>x.val));
  app.innerHTML=`<a class="banner" href="#/c/${w.slug}"><div class="bt"><small>WEDDING SEASON ${new Date().getFullYear()}</small><h1>Wedding Return Gifts</h1><p>${ALL.length}+ designs · starting ₹${lo} · bulk orders welcome</p><span class="cta">Shop now</span></div>
  <div class="bi"><img src="${img(subs.find(s=>s.slug==="sb")||subs[0],0)}" alt=""><img src="${img(subs.find(s=>s.slug==="p5")||subs[0],3)}" alt=""><img src="${img(subs.find(s=>s.slug==="r6")||subs[0],1)}" alt=""></div></a>
  <div class="sec"><h2>Shop by collection</h2><a href="#/c/${w.slug}">View all</a></div>
  <div class="cols">${subs.slice(0,12).map(s=>`<a class="col" href="#/c/${w.slug}/${s.slug}"><img loading="lazy" src="${img(s,0)}" alt=""><div><b>${esc(s.t)}</b><span>From ₹${Math.min(...s.items.map(x=>x.val))}</span></div></a>`).join("")}</div>
  <div class="sec"><h2>Popular picks</h2></div>${grid(feat,"rec")}`;
}
function allCats(){
  strip("");
  app.innerHTML=`<div class="head"><h1>All categories</h1><p>Tap a category to browse</p></div><div class="cols">${CATEGORIES.map(c=>{const live=c.subs.length;const n=c.subs.reduce((a,s)=>a+s.items.length,0);
   return `<a class="col" href="#/c/${c.slug}">${live?`<img src="${img(c.subs[0],0)}" alt="">`:`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#f1f0f8;color:#8d8bb5">${ico(c.slug).replace('class="i"','class="i" style="width:40px;height:40px"')}</div>`}<div><b>${esc(c.name)}</b><span style="${live?"":"color:var(--muted)"}">${live?n+" designs":"Coming soon"}</span></div></a>`}).join("")}</div>`;
}
function cat(slug,subSlug){
  const c=CATEGORIES.find(x=>x.slug===slug);if(!c)return home();strip(slug);
  if(!c.subs.length){app.innerHTML=`<div class="head"><div class="crumb"><a href="#/">Home</a> › ${esc(c.name)}</div><h1>${esc(c.name)}</h1></div><div class="empty"><div class="ei">${ico(c.slug)}</div><h3>Coming soon</h3><p>We're adding this collection. Message us for current stock.</p><br><a class="btn wa" target="_blank" rel="noopener" href="${wa(`Hi Zooov! What do you have in ${c.name}?`)}">Ask on WhatsApp</a></div>`;return}
  const sub=c.subs.find(s=>s.slug===subSlug);
  const items=sub?sub.items:c.subs.flatMap(s=>s.items);
  const draw=()=>{app.innerHTML=`<div class="head"><div class="crumb"><a href="#/">Home</a> › ${sub?`<a href="#/c/${c.slug}">${esc(c.name)}</a> › ${esc(sub.t)}`:esc(c.name)}</div><h1>${esc(sub?sub.t:c.name)}</h1>${sub?`<p>${items.length} designs${items[0].det?` · ${esc(items[0].det)}`:""}</p>`:`<p>${c.subs.length} collections · ${items.length} designs</p>`}</div>
  <div class="chips"><a class="chip txt ${sub?"":"on"}" href="#/c/${c.slug}">All</a>${c.subs.map(s=>`<a class="chip ${sub===s?"on":""}" href="#/c/${c.slug}/${s.slug}"><img src="${img(s,0)}" alt="">${esc(s.t)}</a>`).join("")}</div>
  ${toolbar(items.length)}${grid(items,sortKey)}`;bindSort(draw);
  const on=$(".chip.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"});};
  draw();
}
function search(q){
  strip("");const t=q.toLowerCase();
  const res=ALL.filter(it=>(it.c+" "+it.s.t+" "+it.det+" "+it.s.g+" "+it.s.cat.name).toLowerCase().includes(t));
  const draw=()=>{app.innerHTML=`<div class="head"><h1>Results for “${esc(q)}”</h1><p>${res.length} designs found</p></div>`+(res.length?toolbar(res.length)+grid(res.slice(0,300),sortKey):`<div class="empty"><div class="ei"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><h3>No matches</h3><p>Try another word or ask us on WhatsApp.</p></div>`);bindSort(draw)};draw();
}
function route(){
  const q=$("#q").value.trim();if(q.length>1)return search(q);
  const h=location.hash.replace(/^#\/?/,"").split("/");
  $$(".bnav [data-nav]").forEach(a=>a.classList.toggle("on",(a.dataset.nav==="home"&&!h[0])||(a.dataset.nav==="all"&&h[0]==="all")));
  if(h[0]==="c")cat(h[1],h[2]);else if(h[0]==="all")allCats();else home();
}
app.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){inL(a.dataset.add)?rmL(a.dataset.add):addL(a.dataset.add);return}
  const s=e.target.closest("[data-show]");if(s)showP(s.dataset.show);
});
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(route,220)});
window.addEventListener("hashchange",()=>{$("#q").value="";closeAll();route();window.scrollTo(0,0)});
badge();route();
</script>
</body>
</html>
